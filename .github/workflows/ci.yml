name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # Nome exigido pela proteção da main: mudar aqui exige atualizar a regra no GitHub.
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Mesmo comando do README: DagBag + testes de estrutura, sem rede.
      - name: Integridade da DAG
        run: docker compose run --rm --build tests
